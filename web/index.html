<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#080a0f">
<meta name="description" content="hushwire - ARP-based LAN discovery with per-device traffic cut, driven from any browser on the segment.">
<title>hushwire</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e1118'/%3E%3Cpath d='M6 16h6M20 16h6' stroke='%235a9dff' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%235a9dff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="pulse" id="readyDot" title="gateway state"></span>
      <span class="name">hushwire</span>
      <span class="ver" id="ver"></span>
    </div>
    <div class="topright">
      <span class="badge" id="connBadge" role="status" aria-live="polite">connecting</span>
      <button class="ghost icon" id="tokenBtn" title="access token" aria-label="access token">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="16" r="4"/><path d="M11 13 20 4"/><path d="m17 7 3 3"/></svg>
      </button>
    </div>
  </header>

  <div class="tokenbar" id="tokenBar" hidden>
    <span class="input-icon">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      <input id="tokenInput" type="password" placeholder="access token" autocomplete="off" spellcheck="false" aria-label="access token">
    </span>
    <button class="primary" id="tokenSave">Save</button>
  </div>

  <section class="strip" id="strip"></section>

  <section class="panel panel-hosts">
    <div class="panel-head">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.2"/><circle cx="3.5" cy="12" r="1.2"/><circle cx="3.5" cy="18" r="1.2"/></svg>
      <h2>Hosts</h2>
      <span class="count" id="hostCount">0</span>
      <div class="spacer"></div>
      <button class="ghost" id="scanBtn">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        <span id="scanLabel">Scan</span>
      </button>
    </div>

    <div class="toolbar">
      <label class="field grow">
        <span>Filter</span>
        <span class="input-icon">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
          <input id="filter" type="search" placeholder="ip, mac or vendor  ( / )" autocomplete="off" spellcheck="false">
        </span>
      </label>
      <label class="field">
        <span>Mode</span>
        <select id="mode">
          <option value="gateway">gateway</option>
          <option value="both">both</option>
        </select>
      </label>
      <label class="field">
        <span>Duration (s)</span>
        <input id="duration" type="number" min="0" step="5" value="0" inputmode="numeric">
      </label>
      <span class="hint">0 = until restored</span>
    </div>

    <div class="host-head" id="hostHead" hidden>
      <span></span>
      <span>Device</span>
      <span>IP address</span>
      <span>MAC address</span>
      <span class="hh-state">State</span>
      <span class="hh-act">Cut / block</span>
    </div>

    <div class="hosts" id="hosts"></div>

    <div class="actionbar">
      <span class="selinfo" id="selInfo"><span id="selLabel">0</span> selected</span>
      <div class="spacer"></div>
      <button class="ghost" id="selVisible" disabled>Select all</button>
      <button class="ghost" id="clearSel" disabled>Clear</button>
      <button class="danger" id="cutBtn" disabled>
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/></svg>
        Cut selected
      </button>
    </div>
  </section>

  <section class="panel panel-cuts">
    <div class="panel-head">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
      <h2>Active cuts</h2>
      <span class="count" id="cutCount">0</span>
      <div class="spacer"></div>
      <button class="ghost" id="restoreAllBtn">Restore all</button>
    </div>
    <div class="cuts" id="cuts"></div>
  </section>

  <section class="panel panel-blocks">
    <div class="panel-head">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v6c0 4.5 3 8 7 9 4-1 7-4.5 7-9V6z"/><path d="m9.6 9.6 4.8 4.8m0-4.8-4.8 4.8"/></svg>
      <h2>Block list</h2>
      <span class="count" id="blockCount">0</span>
      <div class="spacer"></div>
    </div>
    <div class="blocks" id="blocks"></div>
  </section>

  <section class="panel panel-console">
    <div class="panel-head">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3"/><path d="M13 15h4"/></svg>
      <h2>Console</h2>
      <div class="spacer"></div>
      <button class="ghost" id="clearLog">Clear</button>
    </div>
    <div class="console" id="console" role="log" aria-live="polite"></div>
  </section>

  <footer class="foot">
    <span>Only run this on networks you own or are authorized to test.</span>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>
<script src="/app.js"></script>
</body>
</html>
